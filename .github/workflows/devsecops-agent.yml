name: "DevSecOps: Autonomous Triage Agent"

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  analyze-and-remediate:
    name: CodeQL Scan & AI Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # Verifica se o SARIF pré-computado existe (otimização para demo no palco sem espera)
      - name: Check for Pre-computed SARIF
        id: check-sarif
        run: |
          if [ -f "sarif-results/javascript.sarif" ]; then
            echo "has_mock=true" >> $GITHUB_OUTPUT
            echo "⚡ SARIF detectado! Execução rápida do Agente ativada (Modo Palco)."
          else
            echo "has_mock=false" >> $GITHUB_OUTPUT
          fi

      - name: Initialize CodeQL
        if: steps.check-sarif.outputs.has_mock != 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        if: steps.check-sarif.outputs.has_mock != 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
          upload: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Autonomous Agent (Remediation)
        # Roda sempre, mesmo se o CodeQL acusar falha de segurança
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/secops-agent.mjs sarif-results/javascript.sarif
